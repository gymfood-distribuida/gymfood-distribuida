services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: gymfood-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymfood_auth
      POSTGRES_USER: gymfood_user
      POSTGRES_PASSWORD: gymfood_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: gymfood-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Guayaquil
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_auth_data:
  n8n_data: